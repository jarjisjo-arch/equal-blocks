name: Build Debug APK

on:
  push:
    branches: [ "claude/equal-blocks-investigation-fz0hn", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish APK as GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete debug-latest --yes --cleanup-tag 2>/dev/null || true
          sleep 3
          cp app/build/outputs/apk/debug/app-debug.apk Calcly-debug.apk
          gh release create debug-latest \
            Calcly-debug.apk \
            --title "Calcly Debug Build" \
            --notes "Latest Calcly debug APK. Enable Install from unknown sources in settings if prompted." \
            --prerelease \
            --target ${{ github.sha }}
