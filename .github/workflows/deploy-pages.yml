name: Deploy to GitHub Pages

on:
  push:
    branches: [ "claude/equal-blocks-investigation-fz0hn", "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload game file
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/src/main/assets

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
